<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg1)" />
  <circle cx="800" cy="450" r="360" fill="#ffffff" opacity="0.03" />

  <text x="800" y="120" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="46" font-weight="800" fill="#ffffff">같은 수학, 다른 방향</text>

  <!-- AA side -->
  <g transform="translate(100, 200)">
    <rect width="640" height="560" rx="28" fill="#0f766e" opacity="0.92" />
    <text x="320" y="120" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="130" font-weight="800" fill="#ffffff">AA</text>
    <text x="320" y="190" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="30" font-weight="700" fill="#99f6e4">순수수학 · 이론</text>
    <line x1="80" y1="235" x2="560" y2="235" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />
    <text x="320" y="305" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="36" font-weight="700" fill="#ffffff">대수 · 미적분 · 증명</text>
    <text x="320" y="380" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="30" fill="#ffffff" opacity="0.9">Paper 1은 계산기 없이</text>
    <text x="320" y="470" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="28" fill="#ffffff" opacity="0.8">증명 · 손계산을 즐기는 학생</text>
  </g>

  <text x="800" y="490" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="60" font-weight="800" fill="#fde68a">vs</text>

  <!-- AI side -->
  <g transform="translate(860, 200)">
    <rect width="640" height="560" rx="28" fill="#b45309" opacity="0.92" />
    <text x="320" y="120" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="130" font-weight="800" fill="#ffffff">AI</text>
    <text x="320" y="190" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="30" font-weight="700" fill="#fed7aa">응용 · 데이터</text>
    <line x1="80" y1="235" x2="560" y2="235" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />
    <text x="320" y="305" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="36" font-weight="700" fill="#ffffff">모델링 · 통계 · 해석</text>
    <text x="320" y="380" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="30" fill="#ffffff" opacity="0.9">전 과정 GDC 적극 활용</text>
    <text x="320" y="470" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="28" fill="#ffffff" opacity="0.8">데이터 · 맥락을 즐기는 학생</text>
  </g>

  <text x="800" y="840" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="28" font-weight="600" fill="#ffffff" opacity="0.85">어려움의 차이가 아니라 — 방향의 차이</text>
</svg>
