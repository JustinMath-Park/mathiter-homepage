<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg2s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <marker id="arrS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2s)" />

  <text x="800" y="110" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="46" font-weight="800" fill="#ffffff">진도와 SAT는 경쟁이 아니라 순서</text>

  <!-- timeline line -->
  <line x1="180" y1="450" x2="1440" y2="450" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrS)" opacity="0.6" />

  <!-- station 1: Algebra 1 -->
  <g transform="translate(290, 450)">
    <circle cx="0" cy="0" r="16" fill="#475569" />
    <text x="0" y="-70" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="700" fill="#cbd5e1">Algebra 1</text>
    <text x="0" y="-32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#94a3b8">중등 — 대수 기초</text>
  </g>

  <!-- station 2: Geometry -->
  <g transform="translate(610, 450)">
    <circle cx="0" cy="0" r="16" fill="#475569" />
    <text x="0" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="700" fill="#cbd5e1">Geometry</text>
    <text x="0" y="98" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#94a3b8">대수를 1년 쉬는 구간</text>
  </g>

  <!-- station 3: Algebra 2 (HIGHLIGHT) -->
  <g transform="translate(960, 450)">
    <circle cx="0" cy="0" r="26" fill="#fbbf24" />
    <rect x="-180" y="-180" width="360" height="105" rx="18" fill="#4338ca" opacity="0.95" stroke="#fbbf24" stroke-width="3" />
    <text x="0" y="-128" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="40" font-weight="800" fill="#ffffff">Algebra 2</text>
    <text x="0" y="-90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#fde68a">★ 곧 SAT 기초</text>
    <text x="0" y="70" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#e0e7ff">진도 = SAT 준비</text>
  </g>

  <!-- station 4: G11 SAT -->
  <g transform="translate(1320, 450)">
    <circle cx="0" cy="0" r="16" fill="#6366f1" />
    <text x="0" y="-70" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff">G11</text>
    <text x="0" y="-32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#c7d2fe">본격 SAT 크램</text>
    <text x="0" y="56" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" fill="#94a3b8">포맷·시간·Desmos</text>
  </g>

  <text x="800" y="800" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="28" font-weight="600" fill="#ffffff" opacity="0.85">Algebra 2로 내용을 채운 뒤, 본격 SAT는 그 다음에</text>
</svg>
