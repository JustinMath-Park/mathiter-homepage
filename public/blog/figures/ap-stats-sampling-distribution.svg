<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgSD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardSample" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="cardSampling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgSD)" />
  <circle cx="200" cy="180" r="280" fill="#ffffff" opacity="0.04" />
  <circle cx="1400" cy="720" r="320" fill="#ffffff" opacity="0.04" />

  <!-- Header -->
  <text x="800" y="85" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="30" font-weight="700" fill="#ffffff" opacity="0.85" letter-spacing="3">함정 2 — Sample Distribution vs Sampling Distribution</text>
  <text x="800" y="125" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.6" letter-spacing="2">한국 통계 교과서가 묶어버린 두 개념 — 영어로 분리해 사용해야 inference가 흔들리지 않습니다</text>

  <!-- Sample distribution (LEFT) -->
  <g transform="translate(90, 195)">
    <rect width="640" height="610" rx="22" fill="url(#cardSample)" opacity="0.94" />
    <text x="320" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="2">Sample distribution</text>
    <text x="320" y="92" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.7" letter-spacing="2">= 표본의 분포</text>
    <line x1="50" y1="115" x2="590" y2="115" stroke="#ffffff" stroke-width="1" opacity="0.3" />

    <text x="320" y="155" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#ffffff" opacity="0.85">한 sample 안에 들어 있는 데이터들의 분포</text>

    <text x="320" y="195" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#fde68a">예: 한 반 50명의 키 데이터</text>

    <!-- Mini histogram visual -->
    <g transform="translate(170, 220)">
      <!-- Axis -->
      <line x1="0" y1="170" x2="320" y2="170" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
      <line x1="0" y1="170" x2="0" y2="20" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />

      <!-- Bars representing individual data points -->
      <rect x="15" y="148" width="22" height="22" fill="#ffffff" opacity="0.7" />
      <rect x="42" y="130" width="22" height="40" fill="#ffffff" opacity="0.75" />
      <rect x="69" y="105" width="22" height="65" fill="#ffffff" opacity="0.8" />
      <rect x="96" y="78" width="22" height="92" fill="#ffffff" opacity="0.9" />
      <rect x="123" y="58" width="22" height="112" fill="#ffffff" opacity="0.95" />
      <rect x="150" y="48" width="22" height="122" fill="#ffffff" opacity="1" />
      <rect x="177" y="55" width="22" height="115" fill="#ffffff" opacity="0.95" />
      <rect x="204" y="72" width="22" height="98" fill="#ffffff" opacity="0.9" />
      <rect x="231" y="95" width="22" height="75" fill="#ffffff" opacity="0.85" />
      <rect x="258" y="120" width="22" height="50" fill="#ffffff" opacity="0.8" />
      <rect x="285" y="142" width="22" height="28" fill="#ffffff" opacity="0.75" />

      <!-- X-axis label -->
      <text x="160" y="195" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.65">키 (cm)</text>
    </g>

    <!-- Box: data per sample -->
    <g transform="translate(320, 470)">
      <rect x="-250" y="0" width="500" height="50" rx="10" fill="#1e1b4b" opacity="0.65" />
      <text x="0" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">데이터 개수 = n (한 sample의 크기)</text>
    </g>

    <text x="320" y="555" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#fde68a" font-weight="600">한 sample만 보면 끝</text>
    <text x="320" y="580" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.6">평균 1개 · 표준편차 1개</text>
  </g>

  <!-- Sampling distribution (RIGHT) -->
  <g transform="translate(870, 195)">
    <rect width="640" height="610" rx="22" fill="url(#cardSampling)" opacity="0.94" />
    <text x="320" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="2">Sampling distribution</text>
    <text x="320" y="92" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.75" letter-spacing="2">= 표본분포</text>
    <line x1="50" y1="115" x2="590" y2="115" stroke="#ffffff" stroke-width="1" opacity="0.3" />

    <text x="320" y="155" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#ffffff" opacity="0.85">여러 sample에서 구한 통계량(평균·비율)의 분포</text>

    <text x="320" y="195" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#fde68a">예: 50명씩 1000번 sample → 평균 1000개의 분포</text>

    <!-- Sampling distribution visual: normal-ish curve approximating CLT -->
    <g transform="translate(170, 225)">
      <!-- Axis -->
      <line x1="0" y1="170" x2="320" y2="170" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
      <line x1="0" y1="170" x2="0" y2="20" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />

      <!-- Normal curve (CLT shape — taller, narrower) -->
      <path d="M 0 168 Q 40 168, 60 165 Q 80 162, 100 155 Q 120 140, 140 110 Q 160 50, 170 30 Q 180 50, 200 110 Q 220 140, 240 155 Q 260 162, 280 165 Q 300 168, 320 168" fill="#ffffff" opacity="0.85" />

      <!-- Mean marker -->
      <line x1="170" y1="22" x2="170" y2="180" stroke="#fde68a" stroke-width="2.5" stroke-dasharray="6,3" />
      <text x="170" y="195" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#fde68a">μ_x̄</text>
    </g>

    <!-- Box: many sample means -->
    <g transform="translate(320, 475)">
      <rect x="-260" y="0" width="520" height="50" rx="10" fill="#1e1b4b" opacity="0.65" />
      <text x="0" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">σ_x̄ = σ / √n  · CLT로 approximately normal</text>
    </g>

    <text x="320" y="555" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#fde68a" font-weight="600">★ Confidence Interval · Hypothesis Test 의 이론적 기반</text>
    <text x="320" y="580" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.7">5점 학생은 "the sampling distribution of x̄" 일관 사용</text>
  </g>

  <!-- Bottom message -->
  <text x="800" y="855" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.55" letter-spacing="2">영어로 분리해 일관 사용하지 않으면 → CLT · Confidence Interval · Hypothesis Test 모두 무너집니다</text>
</svg>
