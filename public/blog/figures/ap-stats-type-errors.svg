<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgTE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="okGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="errorRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="errorOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgTE)" />
  <circle cx="200" cy="180" r="280" fill="#ffffff" opacity="0.04" />
  <circle cx="1400" cy="720" r="320" fill="#ffffff" opacity="0.04" />

  <!-- Header -->
  <text x="800" y="85" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="30" font-weight="700" fill="#ffffff" opacity="0.85" letter-spacing="3">함정 4 — Type I vs Type II Error</text>
  <text x="800" y="125" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.6" letter-spacing="2">단어를 외우는 게 아니라 "in context"로 적용해야 점수 — 의학 검사 예시로 정리</text>

  <!-- 2x2 matrix -->
  <!-- Matrix area: centered, 720 wide x 480 tall, starts at x=440, y=180 -->

  <!-- Column headers (Reality: H0 true / H0 false) -->
  <text x="640" y="200" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.6" letter-spacing="2">Reality (실제)</text>

  <text x="500" y="240" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#86efac">H0 true</text>
  <text x="500" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.65">병이 없음</text>

  <text x="780" y="240" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#fca5a5">H0 false</text>
  <text x="780" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.65">병이 있음</text>

  <!-- Row headers (Decision) -->
  <g transform="rotate(-90, 320, 470)">
    <text x="320" y="470" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.6" letter-spacing="2">Decision (검사 결과)</text>
  </g>

  <text x="380" y="390" text-anchor="end" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#fca5a5">Reject H0</text>
  <text x="380" y="412" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.65">"병이 있다"고 진단</text>

  <text x="380" y="560" text-anchor="end" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#86efac">Fail to reject H0</text>
  <text x="380" y="582" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.65">"병이 없다"고 진단</text>

  <!-- Matrix cells -->
  <!-- Cell [Reject H0, H0 true] = TYPE I ERROR (false positive) -->
  <g transform="translate(400, 280)">
    <rect width="220" height="180" rx="14" fill="url(#errorRed)" opacity="0.94" />
    <text x="110" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="2">Type I Error</text>
    <text x="110" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.85">False positive</text>
    <line x1="40" y1="95" x2="180" y2="95" stroke="#ffffff" stroke-width="1" opacity="0.3" />
    <text x="110" y="125" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.85">건강한 환자에게</text>
    <text x="110" y="145" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.85">"병이 있다" 진단</text>
    <text x="110" y="170" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#fde68a" font-style="italic">α = P(Type I)</text>
  </g>

  <!-- Cell [Reject H0, H0 false] = CORRECT -->
  <g transform="translate(680, 280)">
    <rect width="220" height="180" rx="14" fill="url(#okGreen)" opacity="0.94" />
    <text x="110" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="2">정답</text>
    <text x="110" y="85" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.85">Correct rejection</text>
    <line x1="40" y1="105" x2="180" y2="105" stroke="#ffffff" stroke-width="1" opacity="0.3" />
    <text x="110" y="135" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.85">아픈 환자에게</text>
    <text x="110" y="155" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.85">"병이 있다" 진단</text>
    <text x="110" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#fde68a" font-style="italic">Power = 1 − β</text>
  </g>

  <!-- Cell [Fail to reject H0, H0 true] = CORRECT -->
  <g transform="translate(400, 480)">
    <rect width="220" height="180" rx="14" fill="url(#okGreen)" opacity="0.94" />
    <text x="110" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="2">정답</text>
    <text x="110" y="85" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.85">Correct retention</text>
    <line x1="40" y1="105" x2="180" y2="105" stroke="#ffffff" stroke-width="1" opacity="0.3" />
    <text x="110" y="135" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.85">건강한 환자에게</text>
    <text x="110" y="155" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.85">"병이 없다" 진단</text>
    <text x="110" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#fde68a" font-style="italic">1 − α</text>
  </g>

  <!-- Cell [Fail to reject H0, H0 false] = TYPE II ERROR (false negative) -->
  <g transform="translate(680, 480)">
    <rect width="220" height="180" rx="14" fill="url(#errorOrange)" opacity="0.94" />
    <text x="110" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="2">Type II Error</text>
    <text x="110" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.85">False negative</text>
    <line x1="40" y1="95" x2="180" y2="95" stroke="#ffffff" stroke-width="1" opacity="0.3" />
    <text x="110" y="125" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.85">아픈 환자에게</text>
    <text x="110" y="145" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.85">"병이 없다" 진단</text>
    <text x="110" y="170" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#fde68a" font-style="italic">β = P(Type II)</text>
  </g>

  <!-- Right-side explanation panel -->
  <g transform="translate(1000, 280)">
    <rect width="500" height="380" rx="22" fill="#1e1b4b" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="250" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#fde68a" letter-spacing="2">의학 검사 예시 — 어느 쪽이 더 심각?</text>
    <line x1="50" y1="70" x2="450" y2="70" stroke="#ffffff" stroke-width="1" opacity="0.3" />

    <g transform="translate(40, 100)">
      <rect width="420" height="100" rx="12" fill="#ef4444" opacity="0.18" stroke="#ef4444" stroke-width="1" stroke-opacity="0.4" />
      <text x="210" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#fca5a5">Type I (false positive)</text>
      <text x="210" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.85">건강한데 "병이 있다" 진단</text>
      <text x="210" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#ffffff" opacity="0.65">→ 추가 검사·불필요한 치료</text>
    </g>

    <g transform="translate(40, 215)">
      <rect width="420" height="100" rx="12" fill="#f97316" opacity="0.18" stroke="#f97316" stroke-width="1" stroke-opacity="0.4" />
      <text x="210" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#fdba74">Type II (false negative)</text>
      <text x="210" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.85">아픈데 "병이 없다" 진단</text>
      <text x="210" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#ffffff" opacity="0.65">→ 치료 못 받음 (생명 위험)</text>
    </g>

    <text x="250" y="345" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#fde68a">★ 의학 맥락에서 Type II가 더 심각</text>
  </g>

  <!-- Bottom message -->
  <g transform="translate(800, 720)">
    <rect x="-680" y="0" width="1360" height="130" rx="18" fill="#fbbf24" opacity="0.10" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="0" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#fde68a" letter-spacing="2">★ 5점 답안의 공통점 — "in this context" 표현 + 비교 판단</text>
    <text x="0" y="76" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.85">단순히 정의를 적으면 안 됩니다. 문제의 맥락(의학 검사·법정 판결 등)에서</text>
    <text x="0" y="100" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.85">무슨 일이 일어났는지를 영어로 적어야 점수가 채워집니다.</text>
  </g>
</svg>
