      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg3)" />
  <circle cx="250" cy="200" r="320" fill="#ffffff" opacity="0.04" />
  <circle cx="1380" cy="720" r="340" fill="#ffffff" opacity="0.04" />

  <text x="800" y="280" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="40" font-weight="600" fill="#99f6e4">AA냐 AI냐, HL이냐 SL이냐 —</text>

  <text x="800" y="420" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="76" font-weight="800" fill="#ffffff">기준은 난이도가 아니라</text>
