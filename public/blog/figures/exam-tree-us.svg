        <text x="20" y="46" font-size="20" font-weight="800" fill="#0b2a57">Caltech</text>
        <text x="20" y="68" font-size="12" fill="#64748b">25–75 percentile</text>
        <text x="20" y="105" font-size="22" font-weight="800" fill="#1d5396">1530–1580</text>
        <text x="20" y="135" font-size="12" fill="#64748b">Math 평균 795</text>
        <text x="20" y="170" font-size="11" font-weight="700" fill="#dc2626">STEM 특화</text>
      </g>
