        <rect x="120" y="6" width="440" height="20" rx="4" fill="#e2e8f0" />
        <rect x="120" y="6" width="75" height="20" rx="4" fill="#3b82f6" />
        <text x="570" y="20" font-size="13" font-weight="700" fill="#0b2a57">17.0%</text>
      </g>
    </g>
