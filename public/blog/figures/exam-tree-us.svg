        <text x="20" y="46" font-size="20" font-weight="800" fill="#0b2a57">Harvard</text>
        <text x="20" y="68" font-size="12" fill="#64748b">25–75 percentile</text>
        <text x="20" y="105" font-size="22" font-weight="800" fill="#1d5396">1500–1580</text>
        <text x="20" y="135" font-size="12" fill="#64748b">Math 770–800</text>
        <text x="20" y="170" font-size="11" font-weight="700" fill="#dc2626">25–26 SAT 필수</text>
      </g>
      <g transform="translate(490, 0)">
        <rect width="220" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
        <rect width="220" height="6" rx="3" fill="#1d5396" />
        <text x="20" y="46" font-size="20" font-weight="800" fill="#0b2a57">Stanford</text>
        <text x="20" y="68" font-size="12" fill="#64748b">25–75 percentile</text>
        <text x="20" y="105" font-size="22" font-weight="800" fill="#1d5396">1500–1560</text>
        <text x="20" y="135" font-size="12" fill="#64748b">Math 770–800</text>
      </g>
