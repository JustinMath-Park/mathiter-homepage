<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Pretendard', sans-serif">
  <defs>
    <linearGradient id="usHeader" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2a57" />
      <stop offset="100%" stop-color="#1d5396" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc" />

  <!-- Header -->
  <rect x="80" y="60" width="1440" height="120" rx="20" fill="url(#usHeader)" />
  <text x="120" y="105" font-size="14" font-weight="700" fill="#ffffff" opacity="0.65" letter-spacing="3">FIG 2 — US TREE</text>
  <text x="120" y="155" font-size="32" font-weight="800" fill="#ffffff">SAT + AP — 미국 대학 입시의 두 축</text>

  <!-- SAT Block -->
  <g transform="translate(80, 220)">
    <rect width="700" height="350" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="700" height="64" rx="20" fill="#1d5396" />
    <rect x="0" y="44" width="700" height="20" fill="#1d5396" />
    <text x="32" y="42" font-size="14" font-weight="700" fill="#ffffff" opacity="0.7" letter-spacing="3">DIGITAL SAT</text>
    <text x="600" y="42" font-size="11" font-weight="700" fill="#ffffff" opacity="0.7" letter-spacing="2">2026 기준</text>

    <!-- Score breakdown -->
    <g transform="translate(40, 100)">
      <text x="0" y="0" font-size="14" fill="#64748b" letter-spacing="1">만점 구조</text>
      <text x="0" y="50" font-size="48" font-weight="800" fill="#0b2a57">1600</text>
      <text x="138" y="50" font-size="20" font-weight="600" fill="#64748b">점</text>

      <g transform="translate(280, 0)">
        <rect width="160" height="70" rx="10" fill="#dbeafe" />
        <text x="80" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#1d5396" letter-spacing="2">R&amp;W</text>
        <text x="80" y="55" text-anchor="middle" font-size="22" font-weight="800" fill="#0b2a57">800</text>
      </g>
      <g transform="translate(460, 0)">
        <rect width="160" height="70" rx="10" fill="#dbeafe" />
        <text x="80" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#1d5396" letter-spacing="2">MATH</text>
        <text x="80" y="55" text-anchor="middle" font-size="22" font-weight="800" fill="#0b2a57">800</text>
      </g>
    </g>

    <!-- Specs -->
    <g transform="translate(40, 200)" font-size="14" fill="#334155">
      <text x="0" y="0">⏱  시험 시간 — 2시간 14분 (Adaptive · 디지털)</text>
      <text x="0" y="32">📅  연 7~8회 응시 가능 (한국·국제 일정 공통)</text>
      <text x="0" y="64">🔁  Super-scoring — 여러 회차 best score 조합 가능</text>
      <text x="0" y="96">🎯  권장: G11 봄 1차 + G12 가을 2차</text>
    </g>
  </g>

  <!-- AP Block -->
  <g transform="translate(820, 220)">
    <rect width="700" height="350" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="700" height="64" rx="20" fill="#1d5396" />
    <rect x="0" y="44" width="700" height="20" fill="#1d5396" />
