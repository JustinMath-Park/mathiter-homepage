        <rect x="120" y="6" width="89" height="20" rx="4" fill="#3b82f6" />
        <text x="570" y="20" font-size="13" font-weight="700" fill="#0b2a57">20.3%</text>
      </g>
      <g transform="translate(0, 120)">
