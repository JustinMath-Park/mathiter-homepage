<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgPri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="card4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="card5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgPri)" />
  <circle cx="200" cy="180" r="280" fill="#ffffff" opacity="0.04" />
  <circle cx="1400" cy="720" r="320" fill="#ffffff" opacity="0.04" />

  <!-- Header -->
  <text x="800" y="90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff" opacity="0.85" letter-spacing="4">G11 한 해 — 우선순위 5원칙</text>
  <text x="800" y="135" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.6" letter-spacing="2">8년 1:1 과외에서 성공·실패 case를 종합한 G11 9월 시작 시점의 점검표</text>

  <!-- Row 1: 3 cards (1, 2, 3) -->
  <!-- Card 1: AP 4과목 이하 -->
  <g transform="translate(90, 200)">
    <rect width="450" height="265" rx="22" fill="url(#card1)" opacity="0.94" />
    <circle cx="60" cy="55" r="32" fill="#fbbf24" />
    <text x="60" y="68" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#7c2d12">1</text>
    <text x="115" y="50" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">AP 4과목 이하</text>
    <text x="115" y="75" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.85" letter-spacing="1">G11 가을 라인업 시점</text>

    <line x1="40" y1="105" x2="410" y2="105" stroke="#ffffff" stroke-width="1" opacity="0.25" />

    <text x="225" y="145" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.85">STEM 5과목 동시 5점은 사실상 불가</text>
    <text x="225" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.85">4과목 모두 5점 &gt; 5과목 중 5점 3개</text>

    <g transform="translate(225, 215)">
      <rect x="-180" y="0" width="360" height="36" rx="10" fill="#1e1b4b" opacity="0.6" />
      <text x="0" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#fde68a">★ 9월에 라인업 잡을 때 결정</text>
    </g>
  </g>

  <!-- Card 2: SAT 3월 첫 응시 -->
  <g transform="translate(575, 200)">
    <rect width="450" height="265" rx="22" fill="url(#card2)" opacity="0.94" />
    <circle cx="60" cy="55" r="32" fill="#fbbf24" />
    <text x="60" y="68" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#1e3a8a">2</text>
    <text x="115" y="50" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">SAT 첫 응시 = 3월</text>
    <text x="115" y="75" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.85" letter-spacing="1">5월은 AP와 겹쳐 위험</text>

    <line x1="40" y1="105" x2="410" y2="105" stroke="#ffffff" stroke-width="1" opacity="0.25" />

    <text x="225" y="145" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.85">3월 첫 → 5월 또는 6월 재응시</text>
    <text x="225" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.85">→ 가을(8월·10월) 마무리</text>

    <g transform="translate(225, 215)">
      <rect x="-180" y="0" width="360" height="36" rx="10" fill="#1e1b4b" opacity="0.6" />
      <text x="0" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#fde68a">★ 가장 안정적인 SAT 응시 경로</text>
    </g>
  </g>

  <!-- Card 3: PSAT 진단 도구 -->
  <g transform="translate(1060, 200)">
    <rect width="450" height="265" rx="22" fill="url(#card3)" opacity="0.94" />
    <circle cx="60" cy="55" r="32" fill="#1e1b4b" />
    <text x="60" y="68" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#fbbf24">3</text>
    <text x="115" y="50" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#1e1b4b">PSAT는 진단 도구</text>
    <text x="115" y="75" font-family="-apple-system, sans-serif" font-size="13" fill="#1e1b4b" opacity="0.85" letter-spacing="1">National Merit가 아니면 부산물로</text>

    <line x1="40" y1="105" x2="410" y2="105" stroke="#1e1b4b" stroke-width="1" opacity="0.25" />

    <text x="225" y="145" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#1e1b4b" opacity="0.85">상위 1% (Selection Index 215+)</text>
    <text x="225" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#1e1b4b" opacity="0.85">외 학생은 영역별 실수 진단용</text>

    <g transform="translate(225, 215)">
      <rect x="-180" y="0" width="360" height="36" rx="10" fill="#1e1b4b" opacity="0.85" />
      <text x="0" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">★ 점수에 일희일비 X</text>
    </g>
  </g>

  <!-- Row 2: 2 cards (4, 5) centered -->
  <!-- Card 4: 5월 우선순위 -->
  <g transform="translate(330, 500)">
    <rect width="450" height="265" rx="22" fill="url(#card4)" opacity="0.94" />
    <circle cx="60" cy="55" r="32" fill="#fbbf24" />
    <text x="60" y="68" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#4c1d95">4</text>
    <text x="115" y="50" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">5월 = AP &gt; final &gt; SAT</text>
    <text x="115" y="75" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.85" letter-spacing="1">한 달 충돌의 우선순위</text>

    <line x1="40" y1="105" x2="410" y2="105" stroke="#ffffff" stroke-width="1" opacity="0.25" />

    <text x="225" y="145" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.85">SAT 5월은 3월 만족이면 skip</text>
    <text x="225" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.85">AP·final은 가을 재응시 불가</text>

    <g transform="translate(225, 215)">
      <rect x="-180" y="0" width="360" height="36" rx="10" fill="#1e1b4b" opacity="0.6" />
      <text x="0" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#fde68a">★ 5월 가장 위험한 한 달</text>
    </g>
  </g>

  <!-- Card 5: 여름 90일 -->
  <g transform="translate(820, 500)">
    <rect width="450" height="265" rx="22" fill="url(#card5)" opacity="0.94" />
    <circle cx="60" cy="55" r="32" fill="#fbbf24" />
    <text x="60" y="68" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#064e3b">5</text>
    <text x="115" y="50" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">여름 90일을 활용</text>
    <text x="115" y="75" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.85" letter-spacing="1">G11 6–8월 = 가장 큰 기회</text>

    <line x1="40" y1="105" x2="410" y2="105" stroke="#ffffff" stroke-width="1" opacity="0.25" />

    <text x="225" y="145" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.85">SAT 8월 + Common App essay 초안</text>
    <text x="225" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.85">+ 카운슬러 추천서 방향 정리</text>

    <g transform="translate(225, 215)">
      <rect x="-180" y="0" width="360" height="36" rx="10" fill="#1e1b4b" opacity="0.6" />
      <text x="0" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#fde68a">★ 학교가 쉬는 유일한 90일</text>
    </g>
  </g>

  <!-- Bottom message -->
  <text x="800" y="830" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.55" letter-spacing="2">G11 9월 시작 시점에 자녀와 한 번 점검해 두면 한 해의 시야가 분명해집니다</text>
</svg>
