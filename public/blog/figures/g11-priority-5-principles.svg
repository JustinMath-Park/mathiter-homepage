<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgPri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ef4444" /><stop offset="100%" stop-color="#991b1b" /></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6" /><stop offset="100%" stop-color="#1e40af" /></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#facc15" /><stop offset="100%" stop-color="#ca8a04" /></linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8b5cf6" /><stop offset="100%" stop-color="#6d28d9" /></linearGradient>
    <linearGradient id="c5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10b981" /><stop offset="100%" stop-color="#047857" /></linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgPri)" />
  <circle cx="200" cy="170" r="280" fill="#ffffff" opacity="0.04" />
  <circle cx="1410" cy="730" r="320" fill="#ffffff" opacity="0.04" />

  <!-- Title -->
  <text x="800" y="100" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="50" font-weight="800" fill="#ffffff">G11 한 해 — 우선순위 5원칙</text>
  <text x="800" y="150" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="23" font-weight="600" fill="#ffffff" opacity="0.65">G11 9월 시작 시점 점검표 · 8년 1:1 과외 성공·실패 case 종합</text>

  <!-- Row 1 -->
  <g transform="translate(80, 192)">
    <rect width="1440" height="115" rx="20" fill="#ffffff" opacity="0.05" />
    <rect width="1440" height="115" rx="20" fill="none" stroke="#ef4444" stroke-width="2" stroke-opacity="0.5" />
    <circle cx="78" cy="57" r="40" fill="url(#c1)" />
    <text x="78" y="72" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="40" font-weight="800" fill="#ffffff">1</text>
    <text x="150" y="52" font-family="-apple-system, sans-serif" font-size="29" font-weight="800" fill="#ffffff">AP는 4과목 이하로</text>
    <text x="150" y="90" font-family="-apple-system, sans-serif" font-size="20" fill="#ffffff" opacity="0.82">STEM 5과목 동시 5점은 사실상 불가 — 핵심 4과목에 집중하는 편이 안전</text>
  </g>
  <!-- Row 2 -->
  <g transform="translate(80, 320)">
    <rect width="1440" height="115" rx="20" fill="#ffffff" opacity="0.05" />
    <rect width="1440" height="115" rx="20" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.5" />
    <circle cx="78" cy="57" r="40" fill="url(#c2)" />
    <text x="78" y="72" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="40" font-weight="800" fill="#ffffff">2</text>
    <text x="150" y="52" font-family="-apple-system, sans-serif" font-size="29" font-weight="800" fill="#ffffff">SAT 첫 응시는 3월</text>
    <text x="150" y="90" font-family="-apple-system, sans-serif" font-size="20" fill="#ffffff" opacity="0.82">5월은 AP와 충돌 — 3월 첫 응시 → 5·6월 또는 가을(8·10월) 마무리</text>
  </g>
  <!-- Row 3 -->
  <g transform="translate(80, 448)">
    <rect width="1440" height="115" rx="20" fill="#ffffff" opacity="0.05" />
    <rect width="1440" height="115" rx="20" fill="none" stroke="#facc15" stroke-width="2" stroke-opacity="0.5" />
    <circle cx="78" cy="57" r="40" fill="url(#c3)" />
    <text x="78" y="72" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="40" font-weight="800" fill="#1e1b4b">3</text>
    <text x="150" y="52" font-family="-apple-system, sans-serif" font-size="29" font-weight="800" fill="#ffffff">PSAT는 진단 도구</text>
    <text x="150" y="90" font-family="-apple-system, sans-serif" font-size="20" fill="#ffffff" opacity="0.82">상위 1%(National Merit) 외엔 영역별 실수 진단용 — 점수에 일희일비 X</text>
  </g>
  <!-- Row 4 -->
  <g transform="translate(80, 576)">
    <rect width="1440" height="115" rx="20" fill="#ffffff" opacity="0.05" />
    <rect width="1440" height="115" rx="20" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.5" />
    <circle cx="78" cy="57" r="40" fill="url(#c4)" />
    <text x="78" y="72" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="40" font-weight="800" fill="#ffffff">4</text>
    <text x="150" y="52" font-family="-apple-system, sans-serif" font-size="29" font-weight="800" fill="#ffffff">5월 우선순위 = AP  ›  final  ›  SAT</text>
    <text x="150" y="90" font-family="-apple-system, sans-serif" font-size="20" fill="#ffffff" opacity="0.82">SAT는 skip 가능 · AP와 학교 final은 그 해 단 한 번뿐</text>
  </g>
  <!-- Row 5 -->
  <g transform="translate(80, 704)">
    <rect width="1440" height="115" rx="20" fill="#ffffff" opacity="0.05" />
    <rect width="1440" height="115" rx="20" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.5" />
    <circle cx="78" cy="57" r="40" fill="url(#c5)" />
    <text x="78" y="72" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="40" font-weight="800" fill="#ffffff">5</text>
    <text x="150" y="52" font-family="-apple-system, sans-serif" font-size="29" font-weight="800" fill="#ffffff">여름 90일을 활용</text>
    <text x="150" y="90" font-family="-apple-system, sans-serif" font-size="20" fill="#ffffff" opacity="0.82">학교가 쉬는 유일한 90일 — SAT 8월 + Common App essay 초안 + 추천서 방향</text>
  </g>
</svg>
