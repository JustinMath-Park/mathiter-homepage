<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg1s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg1s)" />

  <text x="800" y="110" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="48" font-weight="800" fill="#ffffff">SAT 수학 = 사실상 Algebra 1 + 2</text>
  <text x="800" y="158" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="26" font-weight="600" fill="#c7d2fe">미적분·Precalculus는 나오지 않는다</text>

  <!-- bars -->
  <g transform="translate(360, 230)" font-family="-apple-system, sans-serif">
    <!-- Algebra 35% -->
    <text x="-40" y="42" text-anchor="end" font-size="30" font-weight="700" fill="#ffffff">Algebra</text>
    <rect x="0" y="12" width="630" height="50" rx="10" fill="#6366f1" />
    <text x="660" y="48" font-size="28" font-weight="800" fill="#a5b4fc">35%</text>
    <text x="20" y="47" font-size="22" fill="#ffffff" opacity="0.9">Algebra 1 — 일차식</text>

    <!-- Advanced Math 35% -->
    <text x="-40" y="132" text-anchor="end" font-size="30" font-weight="700" fill="#ffffff">Advanced</text>
    <rect x="0" y="102" width="630" height="50" rx="10" fill="#6366f1" />
    <text x="660" y="138" font-size="28" font-weight="800" fill="#a5b4fc">35%</text>
    <text x="20" y="137" font-size="22" fill="#ffffff" opacity="0.9">Algebra 2 — 이차·함수·지수</text>

    <!-- PSDA 15% -->
    <text x="-40" y="222" text-anchor="end" font-size="26" font-weight="600" fill="#cbd5e1">데이터</text>
    <rect x="0" y="196" width="270" height="44" rx="10" fill="#475569" />
    <text x="300" y="228" font-size="24" font-weight="700" fill="#94a3b8">15%</text>

    <!-- Geo 15% -->
    <text x="-40" y="300" text-anchor="end" font-size="26" font-weight="600" fill="#cbd5e1">기하·삼각</text>
    <rect x="0" y="274" width="270" height="44" rx="10" fill="#475569" />
    <text x="300" y="306" font-size="24" font-weight="700" fill="#94a3b8">15%</text>

    <!-- bracket for top two -->
    <path d="M 790 12 q 24 0 24 24 l 0 28 q 0 24 24 24 q -24 0 -24 24 l 0 28 q 0 24 -24 24" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.8" />
    <text x="880" y="95" font-size="34" font-weight="800" fill="#fde68a">약 70%</text>
    <text x="880" y="135" font-size="24" fill="#ffffff" opacity="0.85">= 두 영역이 대수</text>
  </g>

  <text x="800" y="800" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="30" font-weight="700" fill="#ffffff" opacity="0.9">점수 천장을 가르는 Advanced Math의 실체 = Algebra 2</text>
</svg>
