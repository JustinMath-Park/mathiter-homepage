<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgInf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="stepReq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="stepOK" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <marker id="arrowInf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" opacity="0.65" />
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bgInf)" />
  <circle cx="200" cy="180" r="280" fill="#ffffff" opacity="0.04" />
  <circle cx="1400" cy="720" r="320" fill="#ffffff" opacity="0.04" />

  <!-- Header -->
  <text x="800" y="85" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="30" font-weight="700" fill="#ffffff" opacity="0.85" letter-spacing="3">함정 3 — Inference 4-step 절차</text>
  <text x="800" y="125" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.6" letter-spacing="2">한국 학생은 보통 Step 3만 적습니다 — 1·2·4 빠지면 FRQ 점수의 절반 이상이 깎입니다</text>

  <!-- 4 step cards in a row + arrows -->
  <!-- Step 1: Hypotheses -->
  <g transform="translate(70, 200)">
    <rect width="340" height="290" rx="22" fill="url(#stepReq)" opacity="0.94" />
    <circle cx="55" cy="55" r="32" fill="#fbbf24" />
    <text x="55" y="68" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#4c1d95">1</text>
    <text x="105" y="50" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Hypotheses</text>
    <text x="105" y="72" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.75">가설 명시</text>

    <line x1="30" y1="110" x2="310" y2="110" stroke="#ffffff" stroke-width="1" opacity="0.25" />

    <text x="170" y="145" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.85">in context로 적기</text>

    <g transform="translate(170, 165)">
      <rect x="-140" y="0" width="280" height="100" rx="10" fill="#1e1b4b" opacity="0.65" />
      <text x="0" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#86efac">H0: p = 0.60</text>
      <text x="0" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#86efac">Ha: p &gt; 0.60</text>
      <text x="0" y="82" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#ffffff" opacity="0.7">where p = true proportion</text>
    </g>

    <g transform="translate(170, 285)">
      <rect x="-110" y="-15" width="220" height="22" rx="6" fill="#ef4444" opacity="0.85" />
      <text x="0" y="1" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">한국 학생 자주 누락</text>
    </g>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="410" y1="345" x2="438" y2="345" stroke="#ffffff" stroke-width="2" opacity="0.65" marker-end="url(#arrowInf)" />

  <!-- Step 2: Conditions -->
  <g transform="translate(450, 200)">
    <rect width="340" height="290" rx="22" fill="url(#stepReq)" opacity="0.94" />
    <circle cx="55" cy="55" r="32" fill="#fbbf24" />
    <text x="55" y="68" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#4c1d95">2</text>
    <text x="105" y="50" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Conditions</text>
    <text x="105" y="72" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.75">조건 확인</text>

    <line x1="30" y1="110" x2="310" y2="110" stroke="#ffffff" stroke-width="1" opacity="0.25" />

    <text x="170" y="145" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.85">3가지 모두 확인</text>

    <g transform="translate(170, 165)">
      <rect x="-140" y="0" width="280" height="100" rx="10" fill="#1e1b4b" opacity="0.65" />
      <text x="-130" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#86efac">• Randomness (random sample)</text>
      <text x="-130" y="52" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#86efac">• Independence (10% rule)</text>
      <text x="-130" y="76" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#86efac">• Normality (Large Counts / CLT)</text>
    </g>

    <g transform="translate(170, 285)">
      <rect x="-110" y="-15" width="220" height="22" rx="6" fill="#ef4444" opacity="0.85" />
      <text x="0" y="1" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">한국 학생 자주 누락</text>
    </g>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="790" y1="345" x2="818" y2="345" stroke="#ffffff" stroke-width="2" opacity="0.65" marker-end="url(#arrowInf)" />

  <!-- Step 3: Test (한국 학생 OK) -->
  <g transform="translate(830, 200)">
    <rect width="340" height="290" rx="22" fill="url(#stepOK)" opacity="0.95" />
    <circle cx="55" cy="55" r="32" fill="#1e1b4b" />
    <text x="55" y="68" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#fbbf24">3</text>
    <text x="105" y="50" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#1e1b4b">Test (계산)</text>
    <text x="105" y="72" font-family="-apple-system, sans-serif" font-size="12" fill="#1e1b4b" opacity="0.75">test statistic · p-value</text>

    <line x1="30" y1="110" x2="310" y2="110" stroke="#1e1b4b" stroke-width="1" opacity="0.25" />

    <text x="170" y="145" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#1e1b4b" opacity="0.85">수학 계산 영역</text>

    <g transform="translate(170, 165)">
      <rect x="-140" y="0" width="280" height="100" rx="10" fill="#1e1b4b" opacity="0.85" />
      <text x="0" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#fde68a">1-prop z-test</text>
      <text x="0" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#fde68a">z ≈ 1.73</text>
      <text x="0" y="82" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#fde68a">p-value ≈ 0.042</text>
    </g>

    <g transform="translate(170, 285)">
      <rect x="-110" y="-15" width="220" height="22" rx="6" fill="#10b981" opacity="0.95" />
      <text x="0" y="1" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">한국 학생 강점</text>
    </g>
  </g>

  <!-- Arrow 3→4 -->
  <line x1="1170" y1="345" x2="1198" y2="345" stroke="#ffffff" stroke-width="2" opacity="0.65" marker-end="url(#arrowInf)" />

  <!-- Step 4: Conclusion -->
  <g transform="translate(1210, 200)">
    <rect width="340" height="290" rx="22" fill="url(#stepReq)" opacity="0.94" />
    <circle cx="55" cy="55" r="32" fill="#fbbf24" />
    <text x="55" y="68" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#4c1d95">4</text>
    <text x="105" y="50" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Conclusion</text>
    <text x="105" y="72" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.75">in context</text>

    <line x1="30" y1="110" x2="310" y2="110" stroke="#ffffff" stroke-width="1" opacity="0.25" />

    <text x="170" y="145" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.85">"the data provide evidence..."</text>

    <g transform="translate(170, 165)">
      <rect x="-140" y="0" width="280" height="100" rx="10" fill="#1e1b4b" opacity="0.65" />
      <text x="0" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#86efac">Since p (0.042) &lt; α (0.05),</text>
      <text x="0" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#86efac">we reject H0. The data provide</text>
      <text x="0" y="64" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#86efac">significant evidence to support</text>
      <text x="0" y="84" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#86efac">the claim that...</text>
    </g>

    <g transform="translate(170, 285)">
      <rect x="-110" y="-15" width="220" height="22" rx="6" fill="#ef4444" opacity="0.85" />
      <text x="0" y="1" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">한국 학생 자주 누락</text>
    </g>
  </g>

  <!-- Bottom highlight box -->
  <g transform="translate(800, 600)">
    <rect x="-680" y="0" width="1360" height="220" rx="18" fill="#fbbf24" opacity="0.10" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="0" y="50" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#fde68a" letter-spacing="2">★ 5점 학생은 모든 inference 문제에 같은 4-step 템플릿 적용</text>
    <text x="0" y="90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.85">1-prop z-test · 2-prop z-test · 1-sample t-test · 2-sample t-test · chi-square · linear regression</text>
    <text x="0" y="120" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.85">— 모두 같은 Hypotheses → Conditions → Test → Conclusion 4단계로 일관 적용</text>
    <text x="0" y="170" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#fde68a">8주 훈련하면 FRQ 점수가 극적으로 올라갑니다</text>
    <text x="0" y="195" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" opacity="0.55">4점짜리 FRQ에서 Step 1·2·4 빠지면 1–2점 · 4단계 모두 적으면 만점 가능</text>
  </g>
</svg>
