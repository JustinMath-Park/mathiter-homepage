<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Pretendard', sans-serif">
  <defs>
    <linearGradient id="usTrack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d5396" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="ukTrack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc" />

  <!-- Title -->
  <text x="80" y="80" font-size="14" font-weight="700" fill="#64748b" letter-spacing="3">FIG 1 — TIMELINE</text>
  <text x="80" y="125" font-size="36" font-weight="800" fill="#0b2a57">학년별 시험 시점 비교</text>
  <text x="80" y="160" font-size="17" fill="#64748b">G9에 방향이 잡혀야 늦지 않습니다</text>

  <!-- Year column headers -->
  <g transform="translate(220, 230)">
    <g font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="1">
      <text x="0" y="0">G9 / Y10</text>
      <text x="220" y="0">G10 / Y11</text>
      <text x="440" y="0">G11 / Y12</text>
      <text x="660" y="0">G12 / Y13</text>
      <text x="900" y="0">대학 입학</text>
    </g>
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="-10" y1="14" x2="1280" y2="14" />
    </g>
    <g font-size="11" fill="#cbd5e1">
      <text x="0" y="32">만 14–15세</text>
      <text x="220" y="32">만 15–16세</text>
      <text x="440" y="32">만 16–17세</text>
      <text x="660" y="32">만 17–18세</text>
    </g>
  </g>

  <!-- US Track -->
  <g transform="translate(220, 350)">
    <rect x="-150" y="-30" width="120" height="48" rx="10" fill="#1d5396" />
    <text x="-90" y="0" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="2">US TREE</text>
    <text x="-90" y="18" text-anchor="middle" font-size="11" fill="#ffffff" opacity="0.85">SAT + AP</text>

    <!-- Horizontal track line -->
    <rect x="-10" y="0" width="1170" height="6" rx="3" fill="url(#usTrack)" opacity="0.25" />

    <!-- Milestones -->
    <g>
      <circle cx="0" cy="3" r="14" fill="#1d5396" />
      <text x="0" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#0b2a57">Pre-AP</text>
      <text x="0" y="70" text-anchor="middle" font-size="12" fill="#64748b">기초 다지기</text>
    </g>
    <g>
      <circle cx="220" cy="3" r="14" fill="#1d5396" />
      <text x="220" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#0b2a57">AP 1–2개</text>
      <text x="220" y="70" text-anchor="middle" font-size="12" fill="#64748b">Stats / Precalc</text>
    </g>
    <g>
      <circle cx="440" cy="3" r="18" fill="#1d5396" stroke="#3b82f6" stroke-width="3" />
      <text x="440" y="55" text-anchor="middle" font-size="15" font-weight="800" fill="#0b2a57">AP Calc BC</text>
      <text x="440" y="73" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">+ SAT 1차</text>
      <text x="440" y="90" text-anchor="middle" font-size="11" fill="#64748b">5월 + 봄·가을</text>
    </g>
    <g>
      <circle cx="660" cy="3" r="14" fill="#1d5396" />
      <text x="660" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#0b2a57">SAT 2차</text>
      <text x="660" y="70" text-anchor="middle" font-size="12" fill="#64748b">Super-scoring</text>
    </g>
    <g>
      <circle cx="900" cy="3" r="14" fill="#10b981" />
      <text x="900" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#0b2a57">미국 Top 30</text>
      <text x="900" y="70" text-anchor="middle" font-size="12" fill="#64748b">Common App</text>
    </g>
  </g>

  <!-- Center divider -->
  <g transform="translate(220, 510)">
    <line x1="-150" y1="0" x2="1180" y2="0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,6" />
  </g>

  <!-- UK Track -->
  <g transform="translate(220, 620)">
    <rect x="-150" y="-30" width="120" height="48" rx="10" fill="#7c3aed" />
    <text x="-90" y="0" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="2">UK TREE</text>
    <text x="-90" y="18" text-anchor="middle" font-size="11" fill="#ffffff" opacity="0.85">IGCSE → A-Level</text>

    <!-- Horizontal track line -->
    <rect x="-10" y="0" width="1170" height="6" rx="3" fill="url(#ukTrack)" opacity="0.25" />

    <!-- Milestones -->
    <g>
      <circle cx="0" cy="3" r="14" fill="#7c3aed" />
      <text x="0" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#3b0764">IGCSE 시작</text>
      <text x="0" y="70" text-anchor="middle" font-size="12" fill="#64748b">2년 코스</text>
    </g>
    <g>
      <circle cx="220" cy="3" r="18" fill="#7c3aed" stroke="#a855f7" stroke-width="3" />
      <text x="220" y="55" text-anchor="middle" font-size="15" font-weight="800" fill="#3b0764">IGCSE 응시</text>
      <text x="220" y="73" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">A*~G 등급</text>
      <text x="220" y="90" text-anchor="middle" font-size="11" fill="#64748b">5–6월</text>
    </g>
    <g>
      <circle cx="440" cy="3" r="14" fill="#7c3aed" />
      <text x="440" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#3b0764">AS-Level (옵션)</text>
      <text x="440" y="70" text-anchor="middle" font-size="12" fill="#64748b">Year 12</text>
    </g>
    <g>
      <circle cx="660" cy="3" r="18" fill="#7c3aed" stroke="#a855f7" stroke-width="3" />
      <text x="660" y="55" text-anchor="middle" font-size="15" font-weight="800" fill="#3b0764">A-Level 최종</text>
      <text x="660" y="73" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">A*~E 등급</text>
      <text x="660" y="90" text-anchor="middle" font-size="11" fill="#64748b">메인 5–6월</text>
    </g>
    <g>
      <circle cx="900" cy="3" r="14" fill="#10b981" />
      <text x="900" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#3b0764">G5 + HK + SG</text>
      <text x="900" y="70" text-anchor="middle" font-size="12" fill="#64748b">UCAS</text>
    </g>
  </g>

  <!-- Caution callout -->
  <g transform="translate(80, 790)">
    <rect width="1440" height="80" rx="14" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5" />
    <text x="32" y="38" font-size="20" font-weight="700" fill="#92400e">⚠</text>
    <text x="64" y="38" font-size="16" font-weight="700" fill="#92400e">SAT는 연 7–8회 / A-Level은 5–6월 메인 (IAL은 1월·10–11월 추가).</text>
    <text x="64" y="62" font-size="13" fill="#78350f">방향을 1년 늦게 정하면, 그 사이 1년이 통째로 비효율 학년이 됩니다.</text>
  </g>
</svg>
