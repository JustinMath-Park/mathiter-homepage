<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgMay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="apC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="fnC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="stC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgMay)" />
  <circle cx="200" cy="170" r="280" fill="#ffffff" opacity="0.04" />
  <circle cx="1410" cy="730" r="320" fill="#ffffff" opacity="0.04" />

  <!-- BIG title -->
  <text x="800" y="116" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="56" font-weight="800" fill="#fde68a">★ G11 5월 — 시험 3개가 충돌</text>
  <text x="800" y="174" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="29" font-weight="600" fill="#ffffff" opacity="0.78">AP · 학교 final · SAT가 같은 4주에 몰린다</text>

  <!-- 3 big chips -->
  <g transform="translate(70, 240)">
    <rect width="460" height="225" rx="24" fill="url(#apC)" opacity="0.95" />
    <text x="230" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="36" font-weight="800" fill="#ffffff">AP 시험</text>
    <text x="230" y="135" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="30" font-weight="700" fill="#fee2e2">5월 첫 2주</text>
    <text x="230" y="182" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" fill="#ffffff" opacity="0.85">STEM 집중 시험기</text>
  </g>
  <g transform="translate(570, 240)">
    <rect width="460" height="225" rx="24" fill="url(#fnC)" opacity="0.95" />
    <text x="230" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="36" font-weight="800" fill="#ffffff">학교 final</text>
    <text x="230" y="135" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="30" font-weight="700" fill="#ede9fe">5월 말</text>
    <text x="230" y="182" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" fill="#ffffff" opacity="0.85">GPA에 직접 영향</text>
  </g>
  <g transform="translate(1070, 240)">
    <rect width="460" height="225" rx="24" fill="url(#stC)" opacity="0.9" />
    <text x="230" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="36" font-weight="800" fill="#ffffff">SAT</text>
    <text x="230" y="135" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="30" font-weight="700" fill="#dbeafe">5월 첫 주말</text>
    <text x="230" y="182" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" fill="#ffffff" opacity="0.85">3월 만족 시 skip 권장</text>
  </g>

  <!-- Priority strip -->
  <g transform="translate(800, 515)">
    <rect x="-680" y="0" width="1360" height="120" rx="22" fill="#fbbf24" opacity="0.12" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.5" />
    <text x="0" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#fde68a" letter-spacing="3">우선순위</text>
    <text x="0" y="94" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="40" font-weight="800" fill="#ffffff">AP  ›  학교 final  ›  SAT</text>
  </g>
  <text x="800" y="690" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff" opacity="0.72">SAT만 가을(8·10월) 재응시로 만회 가능 — AP · final은 그 해 한 번뿐</text>

  <!-- Bottom takeaway -->
  <g transform="translate(800, 728)">
    <rect x="-620" y="0" width="1240" height="92" rx="20" fill="#ef4444" opacity="0.14" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="0" y="59" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="31" font-weight="800" fill="#fca5a5">셋을 한 달에 다 하려 하면 — 셋 다 무너진다</text>
  </g>
</svg>
