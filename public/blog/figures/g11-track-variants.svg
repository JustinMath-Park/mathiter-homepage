<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgTrack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="hUS" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6" /><stop offset="100%" stop-color="#1e40af" /></linearGradient>
    <linearGradient id="hIB" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10b981" /><stop offset="100%" stop-color="#047857" /></linearGradient>
    <linearGradient id="hKR" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ef4444" /><stop offset="100%" stop-color="#991b1b" /></linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgTrack)" />
  <circle cx="200" cy="170" r="280" fill="#ffffff" opacity="0.04" />
  <circle cx="1410" cy="730" r="320" fill="#ffffff" opacity="0.04" />

  <!-- Title -->
  <text x="800" y="96" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="46" font-weight="800" fill="#ffffff">G11 트랙별 — 5월 충돌이 다르다</text>
  <text x="800" y="142" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="23" font-weight="600" fill="#ffffff" opacity="0.65">같은 G11이라도 학교 트랙에 따라 겹치는 시험이 완전히 다릅니다</text>

  <!-- Column 1: US -->
  <g transform="translate(80, 185)">
    <rect width="460" height="555" rx="22" fill="#ffffff" opacity="0.05" />
    <rect width="460" height="76" rx="22" fill="url(#hUS)" />
    <rect y="40" width="460" height="36" fill="url(#hUS)" />
    <text x="230" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="2">US 미국제</text>
    <text x="230" y="64" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#ffffff" opacity="0.85">KIS 판교·제주 · SIS 분당 등</text>
    <text x="230" y="128" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="19" font-weight="700" fill="#fde68a" letter-spacing="1">★ 5월에 겹치는 것</text>
    <g transform="translate(40, 150)">
      <rect width="380" height="76" rx="12" fill="#ef4444" opacity="0.85" />
      <text x="190" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">AP STEM</text>
      <text x="190" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.9">5월 첫 2주</text>
    </g>
    <g transform="translate(40, 242)">
      <rect width="380" height="76" rx="12" fill="#8b5cf6" opacity="0.85" />
      <text x="190" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">학교 final</text>
      <text x="190" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.9">5월 말</text>
    </g>
    <g transform="translate(40, 334)">
      <rect width="380" height="76" rx="12" fill="#3b82f6" opacity="0.7" />
      <text x="190" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">SAT 5월</text>
      <text x="190" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.9">skip 가능</text>
    </g>
    <text x="230" y="470" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="17" fill="#ffffff" opacity="0.8">AP·final 집중 → SAT는 뒤로</text>
  </g>

  <!-- Column 2: IB -->
  <g transform="translate(570, 185)">
    <rect width="460" height="555" rx="22" fill="#ffffff" opacity="0.05" />
    <rect width="460" height="76" rx="22" fill="url(#hIB)" />
    <rect y="40" width="460" height="36" fill="url(#hIB)" />
    <text x="230" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="2">IB Diploma</text>
    <text x="230" y="64" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#ffffff" opacity="0.85">Chadwick · Dulwich · NLCS · BHA</text>
    <text x="230" y="128" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="19" font-weight="700" fill="#fde68a" letter-spacing="1">★ 5월에 겹치는 것</text>
    <g transform="translate(40, 150)">
      <rect width="380" height="76" rx="12" fill="#10b981" opacity="0.85" />
      <text x="190" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">IB Year 1 mock</text>
      <text x="190" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.9">5월</text>
    </g>
    <g transform="translate(40, 242)">
      <rect width="380" height="76" rx="12" fill="#8b5cf6" opacity="0.85" />
      <text x="190" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">학교 final</text>
      <text x="190" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.9">5월 말</text>
    </g>
    <g transform="translate(40, 334)">
      <rect width="380" height="76" rx="12" fill="#3b82f6" opacity="0.7" />
      <text x="190" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">SAT 5월</text>
      <text x="190" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.9">skip 가능</text>
    </g>
    <text x="230" y="470" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="17" fill="#ffffff" opacity="0.8">mock·final 겹침 → SAT 후순위</text>
  </g>

  <!-- Column 3: 한국 -->
  <g transform="translate(1060, 185)">
    <rect width="460" height="555" rx="22" fill="#ffffff" opacity="0.05" />
    <rect width="460" height="76" rx="22" fill="url(#hKR)" />
    <rect y="40" width="460" height="36" fill="url(#hKR)" />
    <text x="230" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="2">한국 일반 + SAT</text>
    <text x="230" y="64" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#ffffff" opacity="0.85">국내 일반고 학생이 SAT 병행</text>
    <text x="230" y="128" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="19" font-weight="700" fill="#fde68a" letter-spacing="1">★ 가장 큰 충돌점</text>
    <g transform="translate(40, 150)">
      <rect width="380" height="76" rx="12" fill="#ef4444" opacity="0.85" />
      <text x="190" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">한국 내신 기말</text>
      <text x="190" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.9">6–7월</text>
    </g>
    <g transform="translate(40, 242)">
      <rect width="380" height="76" rx="12" fill="#3b82f6" opacity="0.85" />
      <text x="190" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">SAT 6월 응시</text>
      <text x="190" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.9">내신과 정면 충돌</text>
    </g>
    <g transform="translate(40, 334)">
      <rect width="380" height="76" rx="12" fill="#1e1b4b" stroke="#fde68a" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="190" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#fde68a">AP 미응시 일반</text>
      <text x="190" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.85">SAT 봄·여름·가을 분산</text>
    </g>
    <text x="230" y="470" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="17" fill="#ffffff" opacity="0.8">내신 6–7월 vs SAT 6월이 핵심</text>
  </g>
</svg>
