<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgSlot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="apCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="alCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="ibCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgSlot)" />
  <circle cx="200" cy="180" r="280" fill="#ffffff" opacity="0.04" />
  <circle cx="1400" cy="720" r="320" fill="#ffffff" opacity="0.04" />

  <!-- Header -->
  <text x="800" y="85" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff" opacity="0.88" letter-spacing="3">AP · A-Level · IB DP — 같은 자리의 세 경쟁자</text>
  <text x="800" y="125" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.6" letter-spacing="2">고등학교 마지막 2년 (G11–G12 / Y12–Y13) 같은 슬롯 — 학교가 보통 하나만 운영, 학생은 셋 중 하나</text>

  <!-- AP card -->
  <g transform="translate(70, 180)">
    <rect width="460" height="620" rx="22" fill="url(#apCard)" opacity="0.94" />
    <text x="230" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="3">AP</text>
    <text x="230" y="90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.75">Advanced Placement · 미국</text>
    <line x1="40" y1="110" x2="420" y2="110" stroke="#ffffff" stroke-width="1" opacity="0.3" />

    <!-- big concept -->
    <g transform="translate(230, 150)">
      <rect x="-190" y="0" width="380" height="70" rx="12" fill="#fbbf24" opacity="0.95" />
      <text x="0" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#1e3a8a">디플로마 아님</text>
      <text x="0" y="54" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#1e3a8a" opacity="0.85">개별 과목 시험</text>
    </g>

    <g font-family="-apple-system, sans-serif" fill="#ffffff" transform="translate(0, 260)">
      <text x="45" y="0" font-size="14" opacity="0.65">구조</text>
      <text x="415" y="0" text-anchor="end" font-size="14" font-weight="600">과목별 개별 시험</text>

      <text x="45" y="45" font-size="14" opacity="0.65">과목 수</text>
      <text x="415" y="45" text-anchor="end" font-size="14" font-weight="600">학생이 자유 선택 (1~6+)</text>

      <text x="45" y="90" font-size="14" opacity="0.65">채점</text>
      <text x="415" y="90" text-anchor="end" font-size="14" font-weight="600">1–5점 (과목별)</text>

      <text x="45" y="135" font-size="14" opacity="0.65">평가</text>
      <text x="415" y="135" text-anchor="end" font-size="14" font-weight="600">5월 외부 시험</text>

      <text x="45" y="180" font-size="14" opacity="0.65">위치</text>
      <text x="415" y="180" text-anchor="end" font-size="13" font-weight="600">미국 고교 졸업장 위에 얹음</text>
    </g>

    <g transform="translate(230, 555)">
      <rect x="-200" y="0" width="400" height="44" rx="10" fill="#1e1b4b" opacity="0.6" />
      <text x="0" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#93c5fd">넓게 여러 과목 + SAT 병행</text>
    </g>
  </g>

  <!-- A-Level card -->
  <g transform="translate(570, 180)">
    <rect width="460" height="620" rx="22" fill="url(#alCard)" opacity="0.94" />
    <text x="230" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="2">A-Level</text>
    <text x="230" y="90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.75">Advanced Level · 영국</text>
    <line x1="40" y1="110" x2="420" y2="110" stroke="#ffffff" stroke-width="1" opacity="0.3" />

    <g transform="translate(230, 150)">
      <rect x="-190" y="0" width="380" height="70" rx="12" fill="#fbbf24" opacity="0.95" />
      <text x="0" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#6b21a8">3–4과목 깊이</text>
      <text x="0" y="54" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#6b21a8" opacity="0.85">좁고 깊게</text>
    </g>

    <g font-family="-apple-system, sans-serif" fill="#ffffff" transform="translate(0, 260)">
      <text x="45" y="0" font-size="14" opacity="0.65">구조</text>
      <text x="415" y="0" text-anchor="end" font-size="14" font-weight="600">3–4과목 집중</text>

      <text x="45" y="45" font-size="14" opacity="0.65">과목 수</text>
      <text x="415" y="45" text-anchor="end" font-size="14" font-weight="600">보통 3–4과목</text>

      <text x="45" y="90" font-size="14" opacity="0.65">채점</text>
      <text x="415" y="90" text-anchor="end" font-size="14" font-weight="600">A*–E (과목별)</text>

      <text x="45" y="135" font-size="14" opacity="0.65">평가</text>
      <text x="415" y="135" text-anchor="end" font-size="14" font-weight="600">Y13 말 외부 시험</text>

      <text x="45" y="180" font-size="14" opacity="0.65">위치</text>
      <text x="415" y="180" text-anchor="end" font-size="13" font-weight="600">영국 대학 입시 표준</text>
    </g>

    <g transform="translate(230, 555)">
      <rect x="-200" y="0" width="400" height="44" rx="10" fill="#1e1b4b" opacity="0.6" />
      <text x="0" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#c084fc">전공이 분명한 학생에 유리</text>
    </g>
  </g>

  <!-- IB DP card -->
  <g transform="translate(1070, 180)">
    <rect width="460" height="620" rx="22" fill="url(#ibCard)" opacity="0.94" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.5" />
    <text x="230" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="2">IB DP</text>
    <text x="230" y="90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.8">Diploma Programme · IB</text>
    <line x1="40" y1="110" x2="420" y2="110" stroke="#ffffff" stroke-width="1" opacity="0.3" />

    <g transform="translate(230, 150)">
      <rect x="-190" y="0" width="380" height="70" rx="12" fill="#fbbf24" opacity="0.95" />
      <text x="0" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#047857">하나의 디플로마</text>
      <text x="0" y="54" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#047857" opacity="0.85">6과목 + Core 통합</text>
    </g>

    <g font-family="-apple-system, sans-serif" fill="#ffffff" transform="translate(0, 260)">
      <text x="45" y="0" font-size="14" opacity="0.65">구조</text>
      <text x="415" y="0" text-anchor="end" font-size="14" font-weight="600">6과목 + Core 통합</text>

      <text x="45" y="45" font-size="14" opacity="0.65">과목 수</text>
      <text x="415" y="45" text-anchor="end" font-size="14" font-weight="600">6과목 (3 HL + 3 SL) 고정</text>

      <text x="45" y="90" font-size="14" opacity="0.65">채점</text>
      <text x="415" y="90" text-anchor="end" font-size="14" font-weight="600">45점 만점 (합격 24)</text>

      <text x="45" y="135" font-size="14" opacity="0.65">평가</text>
      <text x="415" y="135" text-anchor="end" font-size="13" font-weight="600">내부 + 외부 평가 결합</text>

      <text x="45" y="180" font-size="14" opacity="0.65">위치</text>
      <text x="415" y="180" text-anchor="end" font-size="13" font-weight="600">미국·영국 양쪽 인정</text>
    </g>

    <g transform="translate(230, 555)">
      <rect x="-200" y="0" width="400" height="44" rx="10" fill="#1e1b4b" opacity="0.6" />
      <text x="0" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#34d399">"전부 아니면 전무" 통합 과정</text>
    </g>
  </g>

  <!-- Bottom message -->
  <text x="800" y="850" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#ffffff" opacity="0.6" letter-spacing="2">AP는 개별 과목 시험 · A-Level은 3–4과목 깊이 · IB DP는 6과목 통합 디플로마 — 학교가 보통 하나만 운영합니다</text>
</svg>
