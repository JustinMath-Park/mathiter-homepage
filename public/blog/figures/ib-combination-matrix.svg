<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgMx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="okCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="noCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgMx)" />
  <circle cx="200" cy="180" r="280" fill="#ffffff" opacity="0.04" />
  <circle cx="1400" cy="720" r="320" fill="#ffffff" opacity="0.04" />

  <!-- Header -->
  <text x="800" y="85" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff" opacity="0.88" letter-spacing="3">SAT·AP·A-Level·IB DP — 조합 가능 매트릭스</text>
  <text x="800" y="125" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.6" letter-spacing="2">"SAT·AP 하면서 IB도 추가로?" — 핵심 질문에 대한 답</text>

  <!-- 5 combination cards -->
  <!-- Row 1: 3 possible (green) -->
  <!-- SAT + AP -->
  <g transform="translate(70, 180)">
    <rect width="470" height="200" rx="20" fill="url(#okCard)" opacity="0.94" />
    <text x="60" y="70" font-family="-apple-system, sans-serif" font-size="54" font-weight="800" fill="#ffffff">✓</text>
    <text x="150" y="55" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#ffffff">SAT + AP</text>
    <text x="150" y="88" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.8">미국 트랙의 정석 조합</text>
    <line x1="40" y1="115" x2="430" y2="115" stroke="#ffffff" stroke-width="1" opacity="0.25" />
    <text x="235" y="150" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.85">SAT(표준화 시험) + AP(개별 과목 시험)</text>
    <text x="235" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.65">미국 대학 지원의 기본 패턴</text>
  </g>

  <!-- SAT + IB DP -->
  <g transform="translate(565, 180)">
    <rect width="470" height="200" rx="20" fill="url(#okCard)" opacity="0.94" />
    <text x="60" y="70" font-family="-apple-system, sans-serif" font-size="54" font-weight="800" fill="#ffffff">✓</text>
    <text x="150" y="55" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#ffffff">SAT + IB DP</text>
    <text x="150" y="88" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.8">매우 흔함</text>
    <line x1="40" y1="115" x2="430" y2="115" stroke="#ffffff" stroke-width="1" opacity="0.25" />
    <text x="235" y="150" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.85">IB 학생도 미국 대학 가려면 SAT 준비</text>
    <text x="235" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.65">2025년 MIT·Harvard SAT 재필수화</text>
  </g>

  <!-- SAT + A-Level -->
  <g transform="translate(1060, 180)">
    <rect width="470" height="200" rx="20" fill="url(#okCard)" opacity="0.94" />
    <text x="60" y="70" font-family="-apple-system, sans-serif" font-size="54" font-weight="800" fill="#ffffff">✓</text>
    <text x="150" y="55" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff">SAT + A-Level</text>
    <text x="150" y="88" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.8">흔함</text>
    <line x1="40" y1="115" x2="430" y2="115" stroke="#ffffff" stroke-width="1" opacity="0.25" />
    <text x="235" y="150" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.85">영국 트랙 + 미국 동시 지원 시</text>
    <text x="235" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.65">A-Level(커리큘럼) + SAT(입학 시험)</text>
  </g>

  <!-- Row 2: 2 impossible (red) -->
  <!-- AP + IB DP -->
  <g transform="translate(310, 405)">
    <rect width="470" height="200" rx="20" fill="url(#noCard)" opacity="0.94" />
    <text x="60" y="72" font-family="-apple-system, sans-serif" font-size="54" font-weight="800" fill="#ffffff">✕</text>
    <text x="150" y="55" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#ffffff">AP + IB DP</text>
    <text x="150" y="88" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.85">거의 불가능</text>
    <line x1="40" y1="115" x2="430" y2="115" stroke="#ffffff" stroke-width="1" opacity="0.25" />
    <text x="235" y="150" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.9">학교가 보통 하나만 운영</text>
    <text x="235" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.7">IB 디플로마는 6과목 모두 IB 이수 필요</text>
  </g>

  <!-- A-Level + IB DP -->
  <g transform="translate(820, 405)">
    <rect width="470" height="200" rx="20" fill="url(#noCard)" opacity="0.94" />
    <text x="60" y="72" font-family="-apple-system, sans-serif" font-size="54" font-weight="800" fill="#ffffff">✕</text>
    <text x="150" y="55" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff">A-Level + IB DP</text>
    <text x="150" y="88" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.85">불가능</text>
    <line x1="40" y1="115" x2="430" y2="115" stroke="#ffffff" stroke-width="1" opacity="0.25" />
    <text x="235" y="150" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.9">같은 Y12–Y13 슬롯 경쟁 옵션</text>
    <text x="235" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" opacity="0.7">둘 중 하나만 선택 — 동시 진행 X</text>
  </g>

  <!-- Bottom key takeaway -->
  <g transform="translate(800, 650)">
    <rect x="-680" y="0" width="1360" height="190" rx="18" fill="#fbbf24" opacity="0.10" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="0" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#fde68a" letter-spacing="1">★ 기억할 한 줄</text>
    <text x="0" y="90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="17" fill="#ffffff" opacity="0.9" font-weight="600">SAT는 표준화 시험이라 어느 트리에든 추가할 수 있습니다</text>
    <text x="0" y="125" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="17" fill="#ffffff" opacity="0.9" font-weight="600">AP · A-Level · IB DP는 G11–G12 학교 커리큘럼이라 셋 중 하나만 선택합니다</text>
    <text x="0" y="162" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.6">"SAT·AP 하면서 IB도 추가로"는 두 커리큘럼을 동시에 밟는 셈이라 현실적으로 불가능합니다</text>
  </g>
</svg>
