<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgSp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="spBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="ibBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="usBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="ukBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgSp)" />
  <circle cx="200" cy="180" r="300" fill="#ffffff" opacity="0.04" />
  <circle cx="1400" cy="730" r="340" fill="#ffffff" opacity="0.04" />

  <!-- BIG core message -->
  <text x="800" y="150" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="2">타겟이 정해질수록 native 트리</text>
  <text x="800" y="220" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="36" font-weight="600" fill="#fde68a">불확실할수록 IB</text>

  <!-- Three big destination boxes -->
  <!-- IB (uncertain) -->
  <g transform="translate(180, 330)">
    <rect width="380" height="300" rx="28" fill="url(#ibBox)" opacity="0.94" />
    <text x="190" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="34" font-weight="700" fill="#ffffff">타겟 미정</text>
    <text x="190" y="120" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff" opacity="0.75">/ 글로벌</text>
    <line x1="70" y1="150" x2="310" y2="150" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />
    <text x="190" y="225" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="64" font-weight="800" fill="#fde68a">IB</text>
    <text x="190" y="265" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff" opacity="0.85">양쪽을 다 연다</text>
  </g>

  <!-- US (certain) -->
  <g transform="translate(610, 330)">
    <rect width="380" height="300" rx="28" fill="url(#usBox)" opacity="0.94" />
    <text x="190" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="34" font-weight="700" fill="#ffffff">미국 확실</text>
    <line x1="70" y1="150" x2="310" y2="150" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />
    <text x="190" y="225" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="64" font-weight="800" fill="#fde68a">AP</text>
    <text x="190" y="265" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff" opacity="0.85">강점에 집중</text>
  </g>

  <!-- UK (certain) -->
  <g transform="translate(1040, 330)">
    <rect width="380" height="300" rx="28" fill="url(#ukBox)" opacity="0.94" />
    <text x="190" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="34" font-weight="700" fill="#ffffff">영국 확실</text>
    <line x1="70" y1="150" x2="310" y2="150" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />
    <text x="190" y="225" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="48" font-weight="800" fill="#fde68a">A-Level</text>
    <text x="190" y="265" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff" opacity="0.85">전공 깊이</text>
  </g>

  <!-- Spectrum bar under -->
  <g transform="translate(180, 700)">
    <rect x="0" y="0" width="1240" height="24" rx="12" fill="url(#spBar)" opacity="0.8" />
    <text x="20" y="70" text-anchor="start" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#34d399">◀ 불확실</text>
    <text x="1220" y="70" text-anchor="end" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#93c5fd">확실 ▶</text>
    <text x="620" y="70" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff" opacity="0.6">타겟 지역 확실성</text>
  </g>
</svg>
