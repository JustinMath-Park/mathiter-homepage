<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgIB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="aaBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="aiBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgIB)" />
  <circle cx="220" cy="180" r="300" fill="#ffffff" opacity="0.04" />
  <circle cx="1400" cy="730" r="340" fill="#ffffff" opacity="0.04" />

  <text x="800" y="180" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="78" font-weight="800" fill="#ffffff" letter-spacing="1">IB Math AA vs AI</text>
  <text x="800" y="248" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="34" font-weight="600" fill="#99f6e4">어느 트랙을 골라야 할까</text>

  <g transform="translate(0, 350)">
    <g transform="translate(420, 0)">
      <rect x="-300" y="0" width="600" height="280" rx="28" fill="url(#aaBox)" opacity="0.95" />
      <text x="0" y="110" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="92" font-weight="800" fill="#ffffff">AA</text>
      <text x="0" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="30" font-weight="700" fill="#ffffff">순수 · 이론 · 증명</text>
      <text x="0" y="222" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" fill="#ffffff" opacity="0.85">Analysis and Approaches</text>
    </g>
    <text x="800" y="160" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="56" font-weight="800" fill="#fde68a">vs</text>
    <g transform="translate(1180, 0)">
      <rect x="-300" y="0" width="600" height="280" rx="28" fill="url(#aiBox)" opacity="0.95" />
      <text x="0" y="110" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="92" font-weight="800" fill="#ffffff">AI</text>
      <text x="0" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="30" font-weight="700" fill="#ffffff">응용 · 데이터 · 통계</text>
      <text x="0" y="222" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" fill="#ffffff" opacity="0.85">Applications and Interpretation</text>
    </g>
  </g>

  <text x="800" y="800" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="30" font-weight="700" fill="#ffffff" opacity="0.9">난이도가 아니라 — 목표 전공으로 정한다</text>
</svg>
