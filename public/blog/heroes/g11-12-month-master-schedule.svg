<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgG11" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="mayBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bgG11)" />
  <circle cx="230" cy="180" r="300" fill="#ffffff" opacity="0.04" />
  <circle cx="1400" cy="730" r="340" fill="#ffffff" opacity="0.04" />

  <!-- BIG message -->
  <text x="800" y="135" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="1">G11 — 한 해에 시험 5개가 몰린다</text>
  <text x="800" y="200" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="600" fill="#c7d2fe">SAT · AP · 내신 · PSAT · 대학 원서</text>

  <!-- simple 4-phase timeline -->
  <line x1="180" y1="470" x2="1430" y2="470" stroke="#94a3b8" stroke-width="4" opacity="0.5" marker-end="url(#arrG)" />

  <!-- 가을 -->
  <g transform="translate(300, 470)">
    <circle cx="0" cy="0" r="15" fill="#475569" />
    <text x="0" y="-58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff">가을</text>
    <text x="0" y="62" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="26" fill="#cbd5e1">PSAT · 내신</text>
  </g>
  <!-- 봄 -->
  <g transform="translate(620, 470)">
    <circle cx="0" cy="0" r="15" fill="#3b82f6" />
    <text x="0" y="-58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff">봄 · 3월</text>
    <text x="0" y="62" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="26" fill="#93c5fd">SAT 첫 응시</text>
  </g>
  <!-- ★ 5월 (anchor, highlighted) -->
  <g transform="translate(990, 470)">
    <rect x="-175" y="-150" width="350" height="118" rx="20" fill="url(#mayBox)" opacity="0.96" stroke="#fbbf24" stroke-width="3" />
    <text x="0" y="-100" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff">★ 5월</text>
    <text x="0" y="-58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="25" font-weight="700" fill="#fee2e2">AP + 내신 + SAT 동시</text>
    <circle cx="0" cy="0" r="22" fill="#fbbf24" />
    <text x="0" y="66" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#fca5a5">최대 충돌</text>
  </g>
  <!-- 여름 -->
  <g transform="translate(1330, 470)">
    <circle cx="0" cy="0" r="15" fill="#10b981" />
    <text x="0" y="-58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff">여름 90일</text>
    <text x="0" y="62" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="26" fill="#6ee7b7">재정비 · 원서</text>
  </g>

  <!-- bottom takeaway -->
  <g transform="translate(800, 700)">
    <rect x="-620" y="0" width="1240" height="150" rx="22" fill="#fbbf24" opacity="0.10" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.45" />
    <text x="0" y="62" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="34" font-weight="800" fill="#fde68a">여름방학에 9개월을 미리 펼치면 — 5월 충돌을 피한다</text>
    <text x="0" y="112" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="26" fill="#ffffff" opacity="0.85">우선순위 = AP &gt; 내신 &gt; SAT · 실제 시험일은 매년 공식 일정 확인</text>
  </g>
</svg>
