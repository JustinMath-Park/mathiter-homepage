<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="ch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="ki" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="si" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="nl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg8)" />
  <circle cx="180" cy="180" r="240" fill="#ffffff" opacity="0.04" />
  <circle cx="1420" cy="720" r="280" fill="#ffffff" opacity="0.04" />

  <!-- Header label -->
  <text x="800" y="100" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="28" font-weight="600" fill="#ffffff" opacity="0.75" letter-spacing="6">한국 국제학교 4곳 · 수학 학년별 로드맵</text>

  <!-- Sub-header -->
  <text x="800" y="155" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="18" fill="#ffffff" opacity="0.5" letter-spacing="2">같은 '국제학교'라도 4개 학교는 4개의 다른 길</text>

  <!-- Chadwick -->
  <g transform="translate(80, 230)">
    <rect width="340" height="440" rx="28" fill="url(#ch)" />
    <text x="170" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff">채드윅</text>
    <text x="170" y="115" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.7" letter-spacing="2">CHADWICK · 송도</text>
    <line x1="60" y1="145" x2="280" y2="145" stroke="#ffffff" stroke-width="1" opacity="0.3" />
    <text x="170" y="200" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="600" fill="#ffffff">IB World</text>
    <text x="170" y="240" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.85">PYP · MYP · DP</text>
    <text x="170" y="290" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.7">+ American HS Diploma</text>
    <text x="170" y="360" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.6" letter-spacing="1">G11–G12 IB DP</text>
    <text x="170" y="385" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.6" letter-spacing="1">SAT G11 봄·여름</text>
  </g>

  <!-- KIS -->
  <g transform="translate(450, 230)">
    <rect width="340" height="440" rx="28" fill="url(#ki)" />
    <text x="170" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff">KIS</text>
    <text x="170" y="115" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.7" letter-spacing="2">판교 · 제주</text>
    <line x1="60" y1="145" x2="280" y2="145" stroke="#ffffff" stroke-width="1" opacity="0.3" />
    <text x="170" y="200" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="600" fill="#ffffff">American AP</text>
    <text x="170" y="240" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.85">판교 25+ AP / 제주 18 AP</text>
    <text x="170" y="290" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.7">IB 미운영</text>
    <text x="170" y="360" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.6" letter-spacing="1">G10–G11 AP 시작</text>
    <text x="170" y="385" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.6" letter-spacing="1">SAT G11 봄</text>
  </g>

  <!-- SIS -->
  <g transform="translate(820, 230)">
    <rect width="340" height="440" rx="28" fill="url(#si)" />
    <text x="170" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff">SIS</text>
    <text x="170" y="115" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.7" letter-spacing="2">SEOUL · 분당</text>
    <line x1="60" y1="145" x2="280" y2="145" stroke="#ffffff" stroke-width="1" opacity="0.3" />
    <text x="170" y="200" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="600" fill="#ffffff">100% AP</text>
    <text x="170" y="240" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.85">24 AP · CPM Math</text>
    <text x="170" y="290" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.7">IB 미운영</text>
    <text x="170" y="360" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.6" letter-spacing="1">G11 Pre-Calc · G12 AP Calc</text>
    <text x="170" y="385" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.6" letter-spacing="1">SAT G10–G11</text>
  </g>

  <!-- NLCS Jeju -->
  <g transform="translate(1190, 230)">
    <rect width="340" height="440" rx="28" fill="url(#nl)" />
    <text x="170" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff">NLCS Jeju</text>
    <text x="170" y="115" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.7" letter-spacing="2">NORTH LONDON · 제주</text>
    <line x1="60" y1="145" x2="280" y2="145" stroke="#ffffff" stroke-width="1" opacity="0.3" />
    <text x="170" y="200" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="600" fill="#ffffff">British + IB</text>
    <text x="170" y="240" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.85">Y10–Y11 IGCSE</text>
    <text x="170" y="290" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.7">Y12–Y13 IB Diploma</text>
    <text x="170" y="360" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.6" letter-spacing="1">A-Level 미운영</text>
    <text x="170" y="385" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.6" letter-spacing="1">평균 IB 37.0점 (2025)</text>
  </g>

  <!-- Bottom note -->
  <text x="800" y="820" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.45" letter-spacing="2">학년 매핑 · 시험 트리 · SAT/AP/IB 진입 시점이 모두 다릅니다</text>
</svg>
