  <circle cx="1370" cy="760" r="320" fill="#ffffff" opacity="0.04" />

  <text x="800" y="148" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="40" font-weight="700" fill="#5eead4">말레이시아 국제학교 시리즈 ③ · 페낭</text>
  <text x="800" y="226" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="58" font-weight="800" fill="#ffffff">여유로운 섬 · 합리적 비용 · 기숙 옵션</text>

  <g transform="translate(80, 322)">
