    <text x="0" y="120" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" fill="#ffffff" opacity="0.85">미국식 · 영국식 · IB 다양 · 3곳 기숙 운영 · 통학가와 기숙비는 따로</text>
