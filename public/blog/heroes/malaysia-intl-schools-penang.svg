    <text x="226" y="138" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#e0f2fe">POWIIS · Stonyhurst</text>
    <text x="226" y="190" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" fill="#ffffff" opacity="0.85">IGCSE → A-Level</text>
