    <text x="226" y="138" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="34" font-weight="800" fill="#ccfbf1">Uplands</text>
    <text x="226" y="190" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" fill="#ffffff" opacity="0.85">1955년 · 기숙형 IB</text>
  </g>
  <g transform="translate(573, 322)">
