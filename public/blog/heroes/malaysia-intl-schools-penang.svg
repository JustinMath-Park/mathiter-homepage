    <linearGradient id="pUK" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0ea5e9" /><stop offset="100%" stop-color="#0369a1" /></linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgPG)" />
