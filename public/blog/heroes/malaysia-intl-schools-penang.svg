    <text x="226" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="30" font-weight="800" fill="#ffffff">미국식 · AP</text>
    <text x="226" y="138" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="34" font-weight="800" fill="#fef3c7">Dalat</text>
    <text x="226" y="190" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" fill="#ffffff" opacity="0.9">한국 학생 최다 국적</text>
  </g>
  <g transform="translate(1066, 322)">
    <rect width="453" height="250" rx="24" fill="url(#pUK)" opacity="0.95" />
