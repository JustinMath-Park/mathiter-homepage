<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgAdm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cMap" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6366f1" /><stop offset="100%" stop-color="#4338ca" /></linearGradient>
    <linearGradient id="cInt" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0ea5e9" /><stop offset="100%" stop-color="#0369a1" /></linearGradient>
    <linearGradient id="cPlan" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10b981" /><stop offset="100%" stop-color="#047857" /></linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgAdm)" />
  <circle cx="220" cy="175" r="290" fill="#ffffff" opacity="0.04" />
  <circle cx="1400" cy="730" r="320" fill="#ffffff" opacity="0.04" />

  <!-- BIG title -->
  <text x="800" y="170" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="62" font-weight="800" fill="#ffffff">국제학교 입학시험, MAP이 뭔가요?</text>
  <text x="800" y="232" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="30" font-weight="600" fill="#c7d2fe">적응형 수학·영어 평가 + 면접의 정체 — 8년 1:1 과외 입학 가이드</text>

  <!-- 3 chips -->
  <g transform="translate(70, 320)">
    <rect width="460" height="250" rx="24" fill="url(#cMap)" opacity="0.95" />
    <text x="230" y="86" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff">MAP</text>
    <text x="230" y="142" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#e0e7ff">적응형 수학·영어</text>
    <text x="230" y="190" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" fill="#ffffff" opacity="0.85">학년 아닌 '지금 실력'을 잼</text>
  </g>
  <g transform="translate(570, 320)">
    <rect width="460" height="250" rx="24" fill="url(#cInt)" opacity="0.95" />
    <text x="230" y="86" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Writing · 면접</text>
    <text x="230" y="142" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#e0f2fe">영작 + 영어 인터뷰</text>
    <text x="230" y="190" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" fill="#ffffff" opacity="0.85">+ 모국어(국어) 평가</text>
  </g>
  <g transform="translate(1070, 320)">
    <rect width="460" height="250" rx="24" fill="url(#cPlan)" opacity="0.95" />
    <text x="230" y="86" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff">입학 4주 plan</text>
    <text x="230" y="142" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#d1fae5">어휘 → 문장 → 적응형</text>
    <text x="230" y="190" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" fill="#ffffff" opacity="0.85">아는 실력을 영어로 꺼내기</text>
  </g>

  <!-- Bottom takeaway -->
  <g transform="translate(800, 660)">
    <rect x="-620" y="0" width="1240" height="160" rx="22" fill="#6366f1" opacity="0.12" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5" />
    <text x="0" y="70" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="36" font-weight="800" fill="#e0e7ff">정체를 알면, 입학시험은 두렵지 않습니다</text>
    <text x="0" y="120" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" fill="#ffffff" opacity="0.82">한국 학생의 진짜 벽은 '수학'이 아니라 '영어 수학 어휘'</text>
  </g>
</svg>
