<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgAS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="statBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgAS)" />
  <circle cx="230" cy="180" r="300" fill="#ffffff" opacity="0.04" />
  <circle cx="1400" cy="730" r="340" fill="#ffffff" opacity="0.04" />

  <!-- BIG message -->
  <text x="800" y="130" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="1">AP Statistics — 자주 막히는 5가지 함정</text>
  <text x="800" y="192" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="30" font-weight="600" fill="#fdba74">수학 실력이 아니라 — 영어 서술·통계 개념의 문제</text>

  <!-- 5 trap chips -->
  <g font-family="-apple-system, sans-serif">
    <!-- chip 1 -->
    <g transform="translate(60, 300)">
      <rect width="284" height="210" rx="22" fill="#7f1d1d" opacity="0.9" />
      <circle cx="142" cy="74" r="38" fill="#fca5a5" />
      <text x="142" y="88" text-anchor="middle" font-size="40" font-weight="800" fill="#7f1d1d">1</text>
      <text x="142" y="158" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">FRQ 영어 서술</text>
      <text x="142" y="190" text-anchor="middle" font-size="18" fill="#ffffff" opacity="0.8">justification</text>
    </g>
    <!-- chip 2 -->
    <g transform="translate(364, 300)">
      <rect width="284" height="210" rx="22" fill="#1e40af" opacity="0.9" />
      <circle cx="142" cy="74" r="38" fill="#93c5fd" />
      <text x="142" y="88" text-anchor="middle" font-size="40" font-weight="800" fill="#1e3a8a">2</text>
      <text x="142" y="158" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">Sampling vs Sample</text>
      <text x="142" y="190" text-anchor="middle" font-size="18" fill="#ffffff" opacity="0.8">분포 혼동</text>
    </g>
    <!-- chip 3 -->
    <g transform="translate(668, 300)">
      <rect width="284" height="210" rx="22" fill="#6d28d9" opacity="0.9" />
      <circle cx="142" cy="74" r="38" fill="#c4b5fd" />
      <text x="142" y="88" text-anchor="middle" font-size="40" font-weight="800" fill="#5b21b6">3</text>
      <text x="142" y="158" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Inference 4단계</text>
      <text x="142" y="190" text-anchor="middle" font-size="18" fill="#ffffff" opacity="0.8">절차 누락</text>
    </g>
    <!-- chip 4 -->
    <g transform="translate(972, 300)">
      <rect width="284" height="210" rx="22" fill="#c2410c" opacity="0.9" />
      <circle cx="142" cy="74" r="38" fill="#fdba74" />
      <text x="142" y="88" text-anchor="middle" font-size="40" font-weight="800" fill="#9a3412">4</text>
      <text x="142" y="158" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Type Ⅰ·Ⅱ Error</text>
      <text x="142" y="190" text-anchor="middle" font-size="18" fill="#ffffff" opacity="0.8">정의 혼동</text>
    </g>
    <!-- chip 5 -->
    <g transform="translate(1276, 300)">
      <rect width="284" height="210" rx="22" fill="#047857" opacity="0.9" />
      <circle cx="142" cy="74" r="38" fill="#6ee7b7" />
      <text x="142" y="88" text-anchor="middle" font-size="40" font-weight="800" fill="#065f46">5</text>
      <text x="142" y="158" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Simulation</text>
      <text x="142" y="190" text-anchor="middle" font-size="18" fill="#ffffff" opacity="0.8">randomization</text>
    </g>
  </g>

  <!-- key stat -->
  <g transform="translate(800, 575)">
    <rect x="-470" y="0" width="940" height="92" rx="20" fill="url(#statBox)" opacity="0.95" />
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff">AP Statistics 5점 = 17.0% · STEM AP 중 가장 낮은 편</text>
  </g>

  <!-- bottom takeaway -->
  <text x="800" y="760" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#fde68a">함정은 '수학'이 아니라 '영어·개념'</text>
  <text x="800" y="812" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="26" font-weight="600" fill="#ffffff" opacity="0.85">— 8년 1:1 과외로 짚어 잡는다</text>
</svg>
