<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="krCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="usCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg5)" />
  <circle cx="180" cy="160" r="240" fill="#ffffff" opacity="0.04" />
  <circle cx="1420" cy="740" r="300" fill="#ffffff" opacity="0.04" />

  <!-- Title -->
  <text x="800" y="120" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="28" font-weight="600" fill="#ffffff" opacity="0.75" letter-spacing="6">대치동 → 국제학교</text>

  <!-- Korea card -->
  <g transform="translate(180, 220)">
    <rect width="500" height="500" rx="32" fill="url(#krCard)" />
    <text x="250" y="100" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="36" font-weight="700" fill="#ffffff" opacity="0.9">한국 수학</text>
    <text x="250" y="135" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="18" fill="#ffffff" opacity="0.75">Korean Math</text>

    <text x="250" y="220" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff" opacity="0.95">정밀한 표기 · 추상화</text>
    <text x="250" y="260" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff" opacity="0.95">시계열 학습 · 누적</text>
    <text x="250" y="300" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff" opacity="0.95">시험 압박 속 정확도</text>
    <text x="250" y="340" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff" opacity="0.95">No Calculator</text>

    <text x="250" y="440" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.6" letter-spacing="2">TIMSS · PISA TOP TIER</text>
  </g>

  <!-- Arrow / transition zone -->
  <g transform="translate(800, 470)">
    <circle r="60" fill="#ffffff" opacity="0.12" />
    <path d="M -28,0 L 28,0 M 12,-14 L 28,0 L 12,14" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <!-- US card -->
  <g transform="translate(920, 220)">
    <rect width="500" height="500" rx="32" fill="url(#usCard)" />
    <text x="250" y="100" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="36" font-weight="700" fill="#ffffff" opacity="0.9">미국 수학</text>
    <text x="250" y="135" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="18" fill="#ffffff" opacity="0.75">American Math</text>

    <text x="250" y="220" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff" opacity="0.95">Conceptual · 설명</text>
    <text x="250" y="260" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff" opacity="0.95">Word problem · 응용</text>
    <text x="250" y="300" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff" opacity="0.95">학기 누적 평가</text>
    <text x="250" y="340" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff" opacity="0.95">Desmos · Graphing Calc</text>

    <text x="250" y="440" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" opacity="0.6" letter-spacing="2">COMMON CORE · SAT · AP</text>
  </g>

  <!-- Bottom label -->
  <text x="800" y="800" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="18" fill="#ffffff" opacity="0.55" letter-spacing="2">두 시스템을 다 잘하는 학생들의 공통점은 따로 있습니다</text>
</svg>
